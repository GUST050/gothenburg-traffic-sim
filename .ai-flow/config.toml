version = 1
max_review_cycles = 4
max_test_fix_cycles = 3
agent_timeout_seconds = 7200
check_timeout_seconds = 1800

[roles.planner]
runner = "codex"
profile = "planner"
model = "gpt-5.6-sol"
effort = "xhigh"
sandbox = "read-only"
prompt = ".ai-flow/prompts/planner.md"

[roles.worker]
runner = "claude"
model = "opus"
effort = "high"
permission_mode = "auto"
prompt = ".ai-flow/prompts/worker.md"

[roles.reviewer]
runner = "codex"
profile = "reviewer"
model = "gpt-5.6-sol"
effort = "xhigh"
sandbox = "read-only"
prompt = ".ai-flow/prompts/reviewer.md"

[roles.fixer]
runner = "claude"
model = "opus"
effort = "high"
permission_mode = "auto"
prompt = ".ai-flow/prompts/fixer.md"

[checks]
commands = [
  ["git", "diff", "--check"],
]
