version = 1
max_review_cycles = 3
max_test_fix_cycles = 2
max_blocker_repair_cycles = 2
max_review_findings_per_repair = 5
agent_timeout_seconds = 7200
check_timeout_seconds = 1800

[roles.planner]
runner = "codex"
profile = "planner"
model = "gpt-5.6-sol"
effort = "high"
sandbox = "read-only"
prompt = ".ai-flow/prompts/planner.md"

[roles.worker]
runner = "codex"
model = "gpt-5.6-luna"
effort = "high"
sandbox = "workspace-write"
prompt = ".ai-flow/prompts/worker.md"

[roles.reviewer]
runner = "codex"
profile = "reviewer"
model = "gpt-5.6-sol"
effort = "high"
sandbox = "read-only"
prompt = ".ai-flow/prompts/reviewer.md"

[roles.fixer]
runner = "codex"
model = "gpt-5.6-luna"
effort = "high"
sandbox = "workspace-write"
prompt = ".ai-flow/prompts/fixer.md"

[roles.fixer_fallback]
runner = "codex"
model = "gpt-5.6-sol"
effort = "medium"
sandbox = "workspace-write"
prompt = ".ai-flow/prompts/fixer.md"

[checks]
commands = [
  ["git", "diff", "--check"],
]
