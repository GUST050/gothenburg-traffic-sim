name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # eclipse-sumo (~100 MB binaries) and matplotlib are not needed by the
      # test suite — install the analytical stack only.
      - name: Install dependencies
        run: |
          pip install pandas numpy osmnx pyproj shapely geopandas \
                      lightgbm scikit-learn 'scipy>=1.11,<1.17' \
                      numba==0.60.0 pytest

      - name: Run tests
        run: python3 -m pytest tests/ -q
